version: '3.8'

services:
  app:
    build: .
    container_name: flyrank_billing_engine
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://billing_user:billing_pass@db:5432/billing_db
      - STRIPE_SECRET_KEY=sk_test_placeholder_key
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder_secret
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    container_name: flyrank_billing_postgres
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_pass
      POSTGRES_DB: billing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_user -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

